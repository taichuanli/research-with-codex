research_problem:
  statement: "Tree-of-Thought search uses heuristic LLM self-evaluation, which can prune correct paths or spend tokens exploring logically invalid ones."
  claim_type: author_claim
  source_locator: "Official event abstract"
prior_methods_insufficient:
  statement: "Backtracking alone does not make path selection reliable when the same model generates and judges its reasoning."
  claim_type: author_claim
  source_locator: "Official event abstract"
technical_mechanisms:
  - statement: "Each candidate contains a natural-language thought and an SMT encoding; a solver tests whether it follows from accumulated constraints, then counterexamples drive refinement or search backtracking."
    claim_type: author_claim
    source_locator: "Official event abstract"
  - statement: "The artifact implements sampling, deductive evaluation, counterexample guidance, exploration, backtrack optimization, task adapters, traces, and switches that disable three components."
    claim_type: direct_evidence
    source_locator: "Zenodo artifact / README; core, deductive_steering, smt, and tasks directories"
assumptions:
  - statement: "The LLM's SMT encoding is faithful enough that solver validity transfers back to the natural-language step and original task intent."
    claim_type: agent_inference
    source_locator: "Official abstract / candidate generator and deductive evaluator"
evaluation:
  datasets:
    - statement: "The official abstract reports five benchmarks spanning fault localization, program synthesis, loop invariants, and a mathematical extension; the artifact names Defects4J and LoopInv316 but omits full result tables."
      claim_type: author_claim
      source_locator: "Official event abstract; artifact README / Tasks and unsupported claims"
  baselines:
    - statement: "The abstract describes comparison with ToT-style baselines; exact baseline configurations are unavailable without the manuscript."
