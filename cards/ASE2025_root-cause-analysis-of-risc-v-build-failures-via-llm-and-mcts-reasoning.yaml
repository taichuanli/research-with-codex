  source_locator: "Official abstract"
technical_mechanisms:
  - statement: "RV-LAD template-filters logs and applies phase-aware few-shot LLM anomaly detection; MCTS-RCA searches explanations using a domain knowledge base and classification constraints."
    claim_type: author_claim
    source_locator: "Official abstract"
assumptions:
  - statement: "Log compression preserves root-cause evidence, the knowledge base covers relevant mechanisms, and classification-constrained MCTS traces correspond to true causes."
