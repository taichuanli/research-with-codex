selection_policy:
  include:
    - "Papers explicitly listed in an in-scope official conference track."
    - "A canonical metadata record with title, authors, venue, and at least one source URL."
    - "One record per paper, with alternate versions linked rather than duplicated."
  exclude:
    - "Papers from workshops, co-located events, and tracks outside the stated scope."
    - "Posters, extended abstracts, tool demonstrations, industry papers, and invited material unless the official in-scope track explicitly classifies them as research papers."
    - "Duplicate records, withdrawn papers, and items without enough evidence to establish in-scope status."
  source_expectations:
    - "Use an official conference program, proceedings, or publisher record as the primary scope source."
    - "Retain every consulted source URL and access date in paper metadata."
    - "Mark unresolved inclusion decisions as pending rather than silently excluding them."

initial_taxonomy:
  status: superseded_by_field_mapping
  superseded_by: "synthesis/field-mapping-taxonomy.yaml"
  revision_rule: "Revise only through an explicit, source-backed taxonomy update during the domain-map phase."
  categories:
    - category_id: AI_FOR_SOFTWARE_ENGINEERING
      label: "AI-assisted software engineering"
    - category_id: TESTING_VERIFICATION_DEBUGGING
      label: "Testing, verification, and debugging"
    - category_id: PROGRAM_ANALYSIS_SECURITY_PRIVACY
      label: "Program analysis, security, and privacy"
    - category_id: MAINTENANCE_EVOLUTION_QUALITY
      label: "Maintenance, evolution, and quality"
    - category_id: REQUIREMENTS_DESIGN_ARCHITECTURE
      label: "Requirements, design, and architecture"
    - category_id: EMPIRICAL_SOCIO_TECHNICAL_SE
      label: "Empirical and socio-technical software engineering"
    - category_id: BUILD_RELEASE_OPERATIONS
      label: "Build, release, and software operations"

