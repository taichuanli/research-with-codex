    - PLANNING_ACTION_TOOL_STOPPING
    - TEST_EXECUTION_ANALYSIS_FEEDBACK
    - STATE_MEMORY_SPEC_CONSTRAINT_PRESERVATION
    - OUTCOME_PROGRESS_UNCERTAINTY_SIGNALS
    - DEBUGGING_ROOT_CAUSE_REPAIR_DECISIONS
    - TRAINING_PROCESS_SUPERVISION_POLICY_OPTIMIZATION
  research_preferences:
    include:
      - "Mechanisms relevant to general LLMs, agents, or code agents in software engineering."
      - "Representative methods, empirical and failure studies, training and inference-time controls, feedback mechanisms, contradictory evidence, and mechanistically distinct recent work."
    exclude:
      - "Human-subject and organizational studies, multi-agent organization, pure benchmarks, pure safety or security, pure retrieval, prompt engineering, and work optimizing only cost or final score."
  phase_boundary: "Reading plan only; no full-paper deep reading or research-idea generation was performed."

