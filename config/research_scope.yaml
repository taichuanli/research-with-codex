selection_policy:
  include:
    - "Papers explicitly listed in an in-scope official conference track."
    - "A canonical metadata record with title, authors, venue, and at least one source URL."
    - "One record per paper, with alternate versions linked rather than duplicated."
  exclude:
    - "Papers from workshops, co-located events, and tracks outside the stated scope."
    - "Posters, extended abstracts, tool demonstrations, industry papers, and invited material unless the official in-scope track explicitly classifies them as research papers."
    - "Duplicate records, withdrawn papers, and items without enough evidence to establish in-scope status."
  source_expectations:
    - "Use an official conference program, proceedings, or publisher record as the primary scope source."
    - "Retain every consulted source URL and access date in paper metadata."
    - "Mark unresolved inclusion decisions as pending rather than silently excluding them."

