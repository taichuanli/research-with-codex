schema_version: 3
phase: PRIOR_ART_ATTACK_CROSS_FIELD
idea_id: "IDEA_ACTIONABLE_RECOVERABILITY_CALIBRATION"
review_status: complete
candidate_decomposition:
  research_question:
    statement: "Are terminal success, next-action advantage, and post-action recoverability empirically distinct calibration targets at the same agent checkpoint?"
    claim_type: agent_inference
    source_locator: "ideas/IDEA_ACTIONABLE_RECOVERABILITY_CALIBRATION.yaml / falsifiable_hypothesis"
  core_mechanism:
    statement: "Restore checkpoints, branch over plausible actions and a fixed rescue policy, and compare calibration under terminal, action-value, and rescue-margin labels."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_ACTIONABLE_RECOVERABILITY_CALIBRATION.yaml / core_mechanism"
  intervention_object:
    statement: "Tool, edit, stop, and rollback choices in single-agent trajectories."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_ACTIONABLE_RECOVERABILITY_CALIBRATION.yaml / research_object and intervention_layer"
  experimental_claim:
    statement: "Terminal-confidence estimators should be miscalibrated for action advantage and remaining rescue margin across agents and repositories."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_ACTIONABLE_RECOVERABILITY_CALIBRATION.yaml / minimum_kill_validation"
search_log:
  - searched_at: "2026-07-25"
    query_families:
      - "LLM agent process reward action value next action"
      - "step-wise promise progress process reward model"
      - "Q-value language agent stepwise search"
      - "critical step alternative action flips outcome"
      - "agent recoverability recovery window calibration"
    sources: [arXiv, OpenAlex]
    source_locator: "https://export.arxiv.org/api/query?search_query=(all:%22process%20reward%20model%22%20OR%20all:%22step%20value%22%20OR%20all:%22action%20value%22)%20AND%20(all:%22LLM%20agent%22%20OR%20all:%22language%20agent%22)"
    result:
      statement: "The search found direct action-value and progress targets in QLASS and AgentPRM, outcome-flipping action branches in CSO, and an observational recovery-window construct in Failure as a Process."
      claim_type: direct_evidence
      source_locator: "query above; full texts of arXiv:2502.02584v1, 2511.08325v1, 2602.03412v2, and 2607.09510v1"
  - searched_at: "2026-07-25"
    query_families:
      - "reference and successor chain for action-value PRMs"
      - "version and formal-publication audit"
    sources: [paper_reference_lists, OpenAlex, arXiv]
    source_locator: "AgentPRM Appendix A and references; CSO Related Work; arXiv PDF version headers"
    result:
      statement: "Backward chaining recovered AgentRM, step-level Q-value models, Monte Carlo process supervision, and outcome-verified critical-step methods. CSO had advanced to v2; the other closest records remained recent preprints."
      claim_type: direct_evidence
      source_locator: "AgentPRM Appendix A Table 4; CSO Section 2; arXiv version headers"
works:
  - paper_id: "ARXIV_2511_08325"
    citation: "Xi et al. AgentPRM: Process Reward Models for LLM Agents via Step-Wise Promise and Progress. arXiv:2511.08325v1, 2025."
    stable_url: "https://arxiv.org/abs/2511.08325v1"
    version_status: "preprint_v1"
    relation: direct_coverage
    body_evidence:
      statement: "AgentPRM defines per-decision promise as success likelihood and progress through an advantage term, trains with TD estimation and GAE, and outperforms outcome and process-value baselines across WebShop, BabyAI, and TextCraft."
      claim_type: direct_evidence
      source_locator: "paper Section 3; Section 4.2; Table 1; Section 5.4 and Table 3; Appendix A Table 4"
    coverage:
      statement: "It directly covers the proposed distinction between terminal promise and local action progress/advantage."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "It does not define remaining rescue budget after a bad action or compare all three targets at identical checkpoints."
      claim_type: agent_inference
      source_locator: "paper target definitions; candidate core mechanism"
    required_action: narrow
  - paper_id: "ARXIV_2502_02584"
    citation: "Lin et al. QLASS: Boosting Language Agent Inference via Q-Guided Stepwise Search. arXiv:2502.02584v1, 2025."
    stable_url: "https://arxiv.org/abs/2502.02584v1"
    version_status: "preprint_v1"
    relation: direct_coverage
    body_evidence:
      statement: "QLASS constructs exploration trees, propagates outcome rewards into Q(s,a) labels, trains a QNet, and uses predicted action values for stepwise inference on WebShop, SciWorld, and ALFWorld."
      claim_type: direct_evidence
      source_locator: "paper Sections 3-5; Equation 7; Tables 1-3"
    coverage:
      statement: "It directly covers next-action value estimation and online consumption of that signal."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "It does not separately calibrate terminal confidence or post-action recoverability."
      claim_type: agent_inference
      source_locator: "paper objective and evaluation"
    required_action: narrow
  - paper_id: "ARXIV_2602_03412"
    citation: "Li et al. Verified Critical Step Optimization for LLM Agents. arXiv:2602.03412v2, 2026."
    stable_url: "https://arxiv.org/abs/2602.03412v2"
    version_status: "recent_preprint_v2"
    relation: direct_coverage
    body_evidence:
      statement: "CSO restores candidate decision points, proposes alternative actions, retains steps where an alternative demonstrably flips failure to success, and trains on those verified action pairs; it reports gains on GAIA-Text and XBench-DeepSearch."
      claim_type: direct_evidence
      source_locator: "paper Sections 3.2 and 4.3; Figure 2; Tables 1-4"
    coverage:
      statement: "It directly operationalizes high-impact next-action advantage using counterfactual outcome flips."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "It selects binary pivotal actions rather than estimating a calibrated rescue margin after each action."
      claim_type: agent_inference
      source_locator: "paper Section 3.2; candidate novelty delta"
    required_action: narrow
  - paper_id: "ARXIV_2607_09510"
    citation: "Zhao et al. Failure as a Process: An Anatomy of CLI Coding Agent Trajectories. arXiv:2607.09510v1, 2026."
    stable_url: "https://arxiv.org/abs/2607.09510v1"
    version_status: "recent_preprint_v1"
    relation: partial_overlap
    body_evidence:
      statement: "The paper annotates decisive error, empirical loss of recoverability, and observability, finding a median one-step recovery window and large variation in successful versus failed recovery duration."
      claim_type: direct_evidence
      source_locator: "paper Sections II-E, II-G, III-A, and III-C; Figure 4; Table III"
    coverage:
      statement: "It directly defines and measures an empirical recovery window."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "Its recoverability is retrospective and observational, not an action-conditional calibrated target."
      claim_type: direct_evidence
      source_locator: "paper Threats to Validity / Internal validity"
    required_action: compare
decision:
  outcome: NARROW
  most_damaging_work: "ARXIV_2511_08325"
  rationale:
    statement: "Terminal-versus-next-action value is no longer a defensible novelty claim: AgentPRM, QLASS, and CSO directly cover promise, progress, Q-values, and outcome-flipping action branches. Only the post-action rescue-margin target and a same-checkpoint three-way calibration comparison remain."
    claim_type: agent_inference
    source_locator: "works above"
  covered_problem:
    statement: "Sparse terminal reward misassigns local action credit and misguides stepwise decisions is directly covered."
    claim_type: agent_inference
    source_locator: "ARXIV_2511_08325; ARXIV_2502_02584; ARXIV_2602_03412"
  covered_mechanism:
    statement: "TD/GAE progress models, Q(s,a) estimators, and counterfactual outcome-flip labels are covered."
    claim_type: agent_inference
    source_locator: "same works"
  covered_experiment:
    statement: "Step-value-guided inference and training across several interactive-agent benchmarks are covered."
    claim_type: agent_inference
    source_locator: "AgentPRM Table 1; QLASS Tables 2-3; CSO Table 1"
  novelty_delta:
    statement: "At identical code-agent checkpoints and under a predeclared fixed continuation/rescue policy and budget, estimate post-action rescue margin, then test whether it is distinct from both terminal-success probability and Q(s,a), especially after irreversible or compounding edits."
    claim_type: agent_inference
    source_locator: "uncovered fields above"
  falsifiability:
    status: retained
    statement: "The narrowed claim fails if rescue margin collapses to Q-value/terminal confidence or is unstable under reasonable fixed rescue policies."
    claim_type: agent_inference
    source_locator: "candidate minimum_kill_validation narrowed by prior art"
  reviewer_rejection:
    statement: "Reviewers are likely to call the original three-way decomposition a relabeling of standard value and advantage functions; the narrowed work must isolate a policy-bounded reachability or rescue-margin quantity."
    claim_type: agent_inference
    source_locator: "direct coverage above"
  confidence:
    level: medium
    statement: "Action value and progress are clearly covered, but recoverability depends on a policy-and-budget definition that direct papers do not standardize."
    claim_type: agent_inference
    source_locator: "ARXIV_2607_09510; candidate maximum_risk"
  unverified_information:
    - statement: "The stability of rescue-margin labels across continuation policies is unverified and is a construct-validity gate, not assumed."
      claim_type: agent_inference
      source_locator: "candidate uncertainties"
  carry_forward_to_cross_field_attack: true
cross_field_attack:
  attacked_at: "2026-07-26"
  prior_delta:
    statement: "The direct-attack remainder is a post-action rescue margin at the same checkpoint under a predeclared continuation/rescue policy and budget, separated from terminal confidence and ordinary task Q-values."
    claim_type: direct_evidence
    source_locator: "decision.novelty_delta above"
  abstract_decomposition:
    problem:
      statement: "Estimate whether a state reached after an action remains inside a set from which a fixed or admissible policy can reach a designated acceptable set within a probability or budget threshold."
      claim_type: agent_inference
      source_locator: "candidate_decomposition above; Moldovan and Abbeel 2012 / Section 3.2; Eysenbach et al. 2017 / Section 4.1"
    mechanism:
      statement: "Treat successful rescue or return as an auxiliary reward or reachability event, evaluate its policy-conditioned value after each proposed action, and threshold that value to approve, abort, or switch to a recovery controller."
      claim_type: agent_inference
      source_locator: "Eysenbach et al. 2017 / Equation 1; Thananjeyan et al. 2021 / Equations III.1 and IV.1"
  search_log:
    - searched_at: "2026-07-26"
      query_families:
        - "return policy recoverable state safe exploration MDP"
        - "reset policy Q irreversible state probability of return"
        - "recovery policy risk critic safe set"
        - "reachability controllability viability kernel recoverability"
      sources: [OpenAlex, arXiv, IEEE, full_text]
      source_locator: "https://api.openalex.org/works?search=return%20policy%20recoverable%20state%20reachability%20viability%20safe%20exploration%20reset%20policy; full texts for the four closest works below"
      result:
        statement: "The abstract problem is already treated as probabilistic returnability in safe exploration, reset-policy action value, recovery-set estimation, and reachability or viability analysis; decisive equations and experiments were inspected in the full papers."
        claim_type: direct_evidence
        source_locator: "Moldovan and Abbeel 2012 / Sections 3.2-4 and Figures 4-5; Eysenbach et al. 2017 / Sections 4-6; Thananjeyan et al. 2021 / Sections III-IV and experiments; Fisac et al. 2018 / Definitions 1-4 and Equation 7"
  adjacent_terminology:
    statement: "Adjacent fields call this returnability or reset value, reach-avoid or backward reachability value, recovery or safe set membership, controllability, robust controlled invariance, viability or discriminating kernel, and probability of rescue under a policy."
    claim_type: agent_inference
    source_locator: "closest_cross_field_works below"
  maturity:
    mathematical_form:
      statement: "The quantity is standard. With rescue success as the auxiliary reward, the fixed-policy post-action rescue probability is a Q-function; with admissible policies it is a reachability or viability value whose level set defines recoverable states."
      claim_type: agent_inference
      source_locator: "Eysenbach et al. 2017 / Section 4.1 and Equation 1; Moldovan and Abbeel 2012 / Equation 3; Fisac et al. 2018 / Definitions 1-4 and Equations 6-7"
    standard_algorithms:
      statement: "Established algorithms include constrained safe exploration with a recall policy, learned reset-policy Q thresholds and early abort, safety critics with recovery-policy switching, and Hamilton-Jacobi reachability computation of invariant safe sets."
      claim_type: direct_evidence
      source_locator: "Moldovan and Abbeel 2012 / Algorithm 1; Eysenbach et al. 2017 / Algorithm 1; Thananjeyan et al. 2021 / Algorithm 1; Fisac et al. 2018 / Equation 7 and Section IV"
    evaluation_protocols:
      statement: "The literature evaluates return probability, irreversible-state avoidance, manual resets, task success versus constraint violations, safe-set intervention, and robust flight control in grid worlds, simulated Mars terrain, manipulation, navigation, and physical quadrotors."
      claim_type: direct_evidence
      source_locator: "Moldovan and Abbeel 2012 / Figures 4-5 and Table 1; Eysenbach et al. 2017 / Sections 5-6; Thananjeyan et al. 2021 / Figures 4-6; Fisac et al. 2018 / Sections V-VI"
  closest_cross_field_works:
    - paper_id: "ICML2012_SAFE_EXPLORATION_MDP"
      citation: "Moldovan and Abbeel. Safe Exploration in Markov Decision Processes. ICML 2012; arXiv:1205.4810v3."
      field: "safe exploration and planning"
      stable_url: "https://arxiv.org/abs/1205.4810v3"
      body_evidence:
        statement: "Section 3.2, Equation 3 defines a delta-safe outbound policy by existence of a recall policy that returns to a home state with probability at least delta at the stopping time; Theorem 1 proves exact feasibility NP-hard, and Sections 4-5 evaluate a tractable conservative method in grid and Mars exploration."
        claim_type: direct_evidence
        source_locator: "Section 3.2, Equation 3 and Theorem 1; Algorithm 1; Figures 4-5"
      overlap:
        statement: "It directly formalizes probability of rescue after an arbitrary stopping point under an explicit return policy and threshold."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "Its home-state objective differs from successful code repair, but replacing the target set and horizon changes the task instantiation rather than the mathematical object."
        claim_type: agent_inference
        source_locator: "paper Equation 3; candidate prior_delta"
    - paper_id: "ICLR2018_LEAVE_NO_TRACE"
      citation: "Eysenbach et al. Leave No Trace: Learning to Reset for Safe and Autonomous Reinforcement Learning. ICLR 2018; arXiv:1711.06782v1."
      field: "reinforcement learning and reversibility"
      stable_url: "https://arxiv.org/abs/1711.06782v1"
      body_evidence:
        statement: "Section 4 learns a reset policy with an auxiliary reset reward; Section 4.1 uses Q_reset(s,a) and Equation 1 to approve forward actions above a threshold and abort before irreversible states, then evaluates manual resets and unsafe actions in control tasks."
        claim_type: direct_evidence
        source_locator: "Sections 4-6; Equation 1; Algorithm 1"
      overlap:
        statement: "For a binary rescue reward, Q_reset(s,a) is precisely the policy-conditioned probability or discounted value of rescue after taking action a."
        claim_type: agent_inference
        source_locator: "paper Sections 4 and 4.1"
      code_boundary:
        statement: "Code-specific continuation budgets, test oracles, and edit semantics only specify the reset reward, transition process, and allowed policy."
        claim_type: agent_inference
        source_locator: "candidate prior_delta; paper MDP construction"
    - paper_id: "RA_L2021_RECOVERY_RL"
      citation: "Thananjeyan et al. Recovery RL: Safe Reinforcement Learning with Learned Recovery Zones. IEEE Robotics and Automation Letters, 2021; arXiv:2010.15920v2."
      field: "safe reinforcement learning and robotics"
      stable_url: "https://arxiv.org/abs/2010.15920v2"
      body_evidence:
        statement: "Sections III-IV define a fixed-policy safety critic as discounted future constraint-violation probability, threshold it into safe and recovery sets, and switch from a task policy to a recovery policy; simulation and physical-robot experiments compare task successes and violations."
        claim_type: direct_evidence
        source_locator: "Equations III.1 and IV.1-IV.4; Algorithm 1; Figures 4-6"
      overlap:
        statement: "It covers the complementary failure-probability version of a policy-conditioned rescue margin and the resulting recovery gate."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "Its constraints are physical safety events rather than semantic patch failure, but the critic and policy dependence are unchanged."
        claim_type: agent_inference
        source_locator: "paper Section III; candidate research object"
    - paper_id: "TAC2019_GENERAL_SAFETY_FRAMEWORK"
      citation: "Fisac et al. A General Safety Framework for Learning-Based Control in Uncertain Robotic Systems. IEEE Transactions on Automatic Control 64(7), 2019. DOI:10.1109/TAC.2018.2876389."
      field: "control theory, reachability, and viability"
      stable_url: "https://doi.org/10.1109/TAC.2018.2876389"
      body_evidence:
        statement: "Definitions 1-4 define robust controlled invariance, the maximal safe set, the discriminating kernel, and an optimal safe policy; Equation 7 computes the safety value through an HJI variational inequality, and later sections validate interventions on quadrotors."
        claim_type: direct_evidence
        source_locator: "Definitions 1-4; Equations 6-7; Sections V-VI"
      overlap:
        statement: "It supplies the mature set-valued and value-function generalization of whether a state remains recoverable or viable under bounded uncertainty."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "Continuous dynamics and adversarial disturbances differ from repository transitions, but this does not leave a distinct recoverability definition."
        claim_type: agent_inference
        source_locator: "paper Sections III-IV; candidate abstract_decomposition"
  transfer_assessment:
    direct_transfer:
      statement: "The narrowed code-agent target is a direct instantiation of reset-policy Q or finite-horizon reachability under a chosen rescue policy and acceptable terminal set. Calling it rescue margin does not create a different estimand."
      claim_type: agent_inference
      source_locator: "maturity and closest_cross_field_works above"
    code_specific_structure:
      statement: "Repositories offer cheap version-control snapshots, executable tests, inspectable diffs, and some externally irreversible actions. These features make labels easier to collect and stratify but do not alter the state, action, policy, horizon, or target-set terms of the standard formulation."
      claim_type: agent_inference
      source_locator: "candidate intervention_object and prior_delta; cross-field mathematical forms above"
    general_environment_substitutability:
      statement: "Any simulator or controlled robot task with a checkpoint, rescue controller, budget, and success set can substitute for the code environment in the claimed definition and calibration study."
      claim_type: agent_inference
      source_locator: "all four closest-work experiments"
    residual_contribution:
      primary_class: only_application_transfer
      statement: "No new phenomenon, problem definition, mechanism, causal identification result, or applicability boundary is specified beyond measuring a mature recoverability value on software-agent trajectories."
      claim_type: agent_inference
      source_locator: "direct_transfer, code_specific_structure, and general_environment_substitutability above"
    application_transfer_only:
      value: true
      statement: "A positive code-agent result would demonstrate the usefulness of a known reachability target in another domain, not establish a distinct research object."
      claim_type: agent_inference
      source_locator: "residual_contribution above"
  minimum_pilot:
    remains_direction_killing: true
    design:
      statement: "A small replay study could still test label stability across rescue policies and whether a reachability critic improves on terminal confidence, but it should be framed only as an implementation feasibility check."
      claim_type: agent_inference
      source_locator: "candidate falsifiability above; standard policy-dependence in closest works"
    kill_criterion:
      statement: "Empirically kill the transfer if rescue labels vary materially across reasonable policies or add no predictive value beyond terminal success and Q-values; even a positive pilot does not recover a cross-field novelty delta."
      claim_type: agent_inference
      source_locator: "candidate decision.falsifiability above; cross-field maturity"
  decision:
    outcome: KILL
    most_damaging_work: "ICLR2018_LEAVE_NO_TRACE"
    rationale:
      statement: "Fixed-policy post-action rescue is already a reset or reachability Q-value, and admissible-policy rescue is already reachability or viability. Code supplies a convenient transition system and oracle but no non-substitutable mathematical or experimental structure."
      claim_type: agent_inference
      source_locator: "maturity and transfer_assessment above"
    exact_delta:
      statement: "No standalone delta remains; a code-agent implementation would be an application of established reachability or reset-value calibration."
      claim_type: agent_inference
      source_locator: "residual_contribution above"
    confidence:
      level: high
      statement: "Multiple independent safe-RL and control traditions directly formalize both policy-conditioned rescue probability and recoverable sets, including action-level thresholding and mature evaluations."
      claim_type: agent_inference
      source_locator: "closest_cross_field_works above"
    unverified_information:
      - statement: "How to construct a Markov or belief-state representation for partially observed code-agent checkpoints remains unverified, but that is an estimation challenge inside the standard formulation."
        claim_type: agent_inference
        source_locator: "candidate maximum_risk; POMDP and fixed-policy assumptions above"
      - statement: "A complete intent oracle for alternative valid patches is unavailable; changing the target set does not create a new recoverability quantity."
        claim_type: agent_inference
        source_locator: "synthesis/cross-paper-synthesis.md / P7"
    carry_forward_to_direction_narrowing: false
