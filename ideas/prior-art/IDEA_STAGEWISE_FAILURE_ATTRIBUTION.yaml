schema_version: 3
phase: PRIOR_ART_ATTACK_CROSS_FIELD
idea_id: "IDEA_STAGEWISE_FAILURE_ATTRIBUTION"
review_status: complete
candidate_decomposition:
  research_question:
    statement: "Can replay interventions distinguish evidence-acquisition, state-construction, action-selection, and validation failures that produce similar visible coding-agent loops?"
    claim_type: agent_inference
    source_locator: "ideas/IDEA_STAGEWISE_FAILURE_ATTRIBUTION.yaml / falsifiable_hypothesis and research_object"
  core_mechanism:
    statement: "Restore a matched checkpoint and substitute one stage with an oracle or controlled degradation while holding earlier state fixed."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_STAGEWISE_FAILURE_ATTRIBUTION.yaml / core_mechanism"
  intervention_object:
    statement: "Replayable single-agent trajectories, their derived state, next action, and acceptance signal."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_STAGEWISE_FAILURE_ATTRIBUTION.yaml / research_object and intervention_layer"
  experimental_claim:
    statement: "A four-stage rescue matrix should predict recovery out of repository better than error counts or descriptive trace labels."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_STAGEWISE_FAILURE_ATTRIBUTION.yaml / minimum_kill_validation"
search_log:
  - searched_at: "2026-07-25"
    query_families:
      - "LLM agent failure attribution causal intervention trajectory"
      - "coding agent failure process recovery unrecoverable root cause"
      - "agent trajectory diagnosis oracle substitution rescue"
      - "agent-environment failure taxonomy targeted optimization"
    sources: [arXiv, OpenAlex]
    source_locator: "https://export.arxiv.org/api/query?search_query=(all:%22agent%20failure%22%20OR%20all:%22agent%20trajectory%22)%20AND%20(all:%22root%20cause%22%20OR%20all:%22failure%20mode%22)%20AND%20all:%22large%20language%20model%22"
    result:
      statement: "The search surfaced a July 2026 temporal failure-process study, Aegis, and several trace taxonomies; none reported a four-stage matched oracle-substitution matrix."
      claim_type: direct_evidence
      source_locator: "arXiv query above; full texts of arXiv:2607.09510v1 and arXiv:2508.19504v1"
  - searched_at: "2026-07-25"
    query_families:
      - "backward references from Failure as a Process"
      - "forward citations and later versions of closest works"
    sources: [paper_reference_lists, OpenAlex, arXiv]
    source_locator: "arXiv:2607.09510v1 / Related Work and references; https://api.openalex.org/works?search=Failure%20as%20a%20Process%20CLI%20Coding%20Agent%20Trajectories"
    result:
      statement: "Backward chaining recovered MAST, AgentLens, Beyond Resolution Rates, and prior coding-agent taxonomies. The closest paper was still v1 and too recent for meaningful indexed forward citations at the audit date."
      claim_type: direct_evidence
      source_locator: "arXiv:2607.09510v1 / Related Work and PDF version header; OpenAlex query above"
works:
  - paper_id: "ARXIV_2607_09510"
    citation: "Zhao et al. Failure as a Process: An Anatomy of CLI Coding Agent Trajectories. arXiv:2607.09510v1, 2026."
    stable_url: "https://arxiv.org/abs/2607.09510v1"
    version_status: "recent_preprint_v1"
    relation: direct_coverage
    body_evidence:
      statement: "The paper annotates 1,794 trajectories from three scaffolds and seven models with decisive-error, loss-of-recoverability, and observability times; it reports a median one-step recovery window and that 71% of successful runs recover from at least one error."
      claim_type: direct_evidence
      source_locator: "paper Sections II-E through III-C; Figure 4; Tables II-III; Findings 2 and 9"
    coverage:
      statement: "It directly covers failure as a temporal process, recovery windows, root-cause categories, and cross-scaffold variation."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "Its comparisons are explicitly observational and it does not replace individual stages while holding a checkpoint fixed."
      claim_type: direct_evidence
      source_locator: "paper Threats to Validity / Internal validity"
    required_action: narrow
  - paper_id: "ARXIV_2508_19504"
    citation: "Song et al. Aegis: Taxonomy and Optimizations for Overcoming Agent-Environment Failures in LLM Agents. arXiv:2508.19504v1, 2025."
    stable_url: "https://arxiv.org/abs/2508.19504v1"
    version_status: "preprint_v1"
    relation: partial_overlap
    body_evidence:
      statement: "Aegis localizes the first failed subtask in 142 failed tasks, separates exploration, exploitation, and resource failures, and evaluates matched environment optimizations that improve average success by 6.7-12.5%."
      claim_type: direct_evidence
      source_locator: "paper Table 1; Sections 3-6; Figure 10; Table 3"
    coverage:
      statement: "It links diagnosed failure classes to targeted interventions and endpoint rescue."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "It does not compare oracle substitutions across evidence, state, action, and validation for the same failed checkpoint."
      claim_type: agent_inference
      source_locator: "paper Sections 4-6; candidate core mechanism"
    required_action: compare
  - paper_id: "ICSE2026_BEYOND_FINAL_CODE"
    citation: "Chen, Ma, and Jiang. Beyond Final Code: A Process-Oriented Error Analysis of Software Development Agents in Real-World GitHub Scenarios. ICSE 2026. DOI:10.1145/3744916.3773140; arXiv:2503.12374v4."
    stable_url: "https://arxiv.org/abs/2503.12374v4"
    version_status: "formal_conference_paper_with_arxiv_v4"
    relation: partial_overlap
    body_evidence:
      statement: "Resolution is almost unchanged between runs with and without any solving error (54.61% versus 54.42%), although larger error counts correlate with lower resolution and task difficulty remains confounded."
      claim_type: direct_evidence
      source_locator: "cards/ICSE2026_beyond-final-code-a-process-oriented-error-analysis-of-software-developm.yaml / evaluation.main_results; paper Table 3 and Figure 2"
    coverage:
      statement: "It demonstrates that visible error presence and count do not identify the causal failure stage."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "It supplies taxonomy and association rather than stage-specific rescue interventions."
      claim_type: agent_inference
      source_locator: "paper method and card conclusion_evidence"
    required_action: compare
  - paper_id: "ISSTA2026_AGENTINSPECT"
    citation: "Manke et al. AgentInspect: Diagnosing Behavioral Failures in Artificial Intelligence Agents. ISSTA 2026."
    stable_url: "https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/83/AgentInspect-Diagnosing-Behavioral-Failures-in-Artificial-Intelligence-Agents"
    version_status: "formal_record_with_artifact_bounded_evidence"
    relation: partial_overlap
    body_evidence:
      statement: "AgentInspect injects tool faults and measures whether agent-level failures become behaviorally visible, but the accessible evidence does not include later-stage oracle replacement."
      claim_type: direct_evidence
      source_locator: "cards/ISSTA2026_agentinspect-diagnosing-behavioral-failures-in-artificial-intelligence-a.yaml / technical_mechanisms, evaluation, and evidence_gaps"
    coverage:
      statement: "It covers causal perturbation at the evidence/tool boundary."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "Its evidence access is artifact-bounded and does not establish a four-stage rescue matrix."
      claim_type: agent_inference
      source_locator: "card metadata.evidence_access and evidence_gaps"
    required_action: compare
decision:
  outcome: SURVIVES_DIRECT_ATTACK
  most_damaging_work: "ARXIV_2607_09510"
  rationale:
    statement: "Direct work now covers temporal failure, recoverability windows, stage-adjacent taxonomies, and targeted environment rescue, but the defining matched four-stage oracle-substitution experiment remains uncovered. The candidate survives only as that causal design, not as a new taxonomy or recovery-window study."
    claim_type: agent_inference
    source_locator: "works above; candidate core_mechanism"
  covered_problem:
    statement: "Describing when coding-agent errors arise, become empirically unrecoverable, and differ by root cause or scaffold is covered."
    claim_type: agent_inference
    source_locator: "ARXIV_2607_09510; ARXIV_2508_19504"
  covered_mechanism:
    statement: "Failure localization, tool-fault injection, and failure-class-specific environment optimization are covered."
    claim_type: agent_inference
    source_locator: "ARXIV_2508_19504; ISSTA2026_AGENTINSPECT"
  covered_experiment:
    statement: "Large observational trajectory studies and targeted environment ablations are covered."
    claim_type: agent_inference
    source_locator: "ARXIV_2607_09510; ARXIV_2508_19504; ICSE2026_BEYOND_FINAL_CODE"
  novelty_delta:
    statement: "At the same replayable failure checkpoint, independently substitute evidence acquisition, derived state, next action, and validation while freezing earlier state, then test whether the resulting rescue vector disambiguates identical visible loop signatures and transfers across scaffolds."
    claim_type: agent_inference
    source_locator: "uncovered fields above"
  falsifiability:
    status: retained
    statement: "The claim fails if replay is unstable, stage effects are not separable, or descriptive trace features predict held-out rescue equally well."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_STAGEWISE_FAILURE_ATTRIBUTION.yaml / minimum_kill_validation"
  reviewer_rejection:
    statement: "The most likely rejection is that oracle substitutions are artificial and the work reduces to another taxonomy if rescue effects do not transfer beyond one harness."
    claim_type: agent_inference
    source_locator: "closest-work coverage and replay limitation"
  confidence:
    level: medium
    statement: "The causal delta is clear, but the closest temporal-process paper appeared in July 2026 and forward-citation indexing is necessarily immature."
    claim_type: agent_inference
    source_locator: "ARXIV_2607_09510 version and citation audit"
  unverified_information:
    - statement: "Whether proprietary coding-agent traces can be deterministically restored at all four stages is unverified."
      claim_type: agent_inference
      source_locator: "candidate replay requirement"
    - statement: "No claim is made that absence of a retrieved oracle-substitution paper establishes novelty."
      claim_type: agent_inference
      source_locator: "AGENTS.md / Evidence and Claims"
  carry_forward_to_cross_field_attack: true
cross_field_attack:
  attacked_at: "2026-07-26"
  prior_delta:
    statement: "The direct-attack remainder is matched replacement of evidence acquisition, derived state, next action, and validation at one restored code-agent checkpoint, summarized as a rescue vector."
    claim_type: direct_evidence
    source_locator: "decision.novelty_delta above"
  abstract_decomposition:
    problem:
      statement: "Attribute a sequential outcome to one of several intervenable mediators or mechanisms when observationally similar trajectories can arise from different causal paths."
      claim_type: agent_inference
      source_locator: "candidate_decomposition above; Geiger et al. 2025 / Sections 2.5 and 3.4.1; Bind et al. 2016 / Sections 2-5"
    mechanism:
      statement: "Restore a base state, replace one intermediate mechanism or mediator with a value from a controlled source run, and compare downstream outcomes while the remaining causal context is fixed."
      claim_type: agent_inference
      source_locator: "candidate_decomposition above; Geiger et al. 2025 / Definitions 44-48 and 52"
  search_log:
    - searched_at: "2026-07-26"
      query_families:
        - "mechanism replacement interchange intervention causal abstraction"
        - "actual causality sequential decision trajectory Dec-POMDP"
        - "sequential mediation longitudinal mediator intervention"
        - "counterfactual long-horizon credit assignment action contribution"
      sources: [OpenAlex, arXiv, JMLR, DOI_records, full_text]
      source_locator: "https://api.openalex.org/works?search=interchange%20intervention%20sequential%20decision%20actual%20causality%20trajectory%20mediation; full texts for the four closest works below"
      result:
        statement: "The search connected the candidate to interchange interventions and causal mediation, actual-cause attribution in sequential decision processes, and counterfactual credit assignment; the decisive works were inspected beyond their abstracts."
        claim_type: direct_evidence
        source_locator: "Geiger et al. 2025 / Sections 2.5 and 3.4.1; Triantafyllou et al. 2022 / Sections 2.2, 3, and 5; Schug et al. 2023 / Sections 3-5; Bind et al. 2016 / Sections 2-5"
  adjacent_terminology:
    statement: "Adjacent fields call the problem interchange intervention or mechanism replacement, causal mediation and path-specific effects, actual causality or responsibility attribution in sequential decision processes, and counterfactual credit assignment."
    claim_type: agent_inference
    source_locator: "closest_cross_field_works below"
  maturity:
    mathematical_form:
      statement: "The intervention itself is mathematically mature: causal abstraction defines simple, recursive, and distributed interchange interventions plus interchange-intervention accuracy, while mediation defines total, direct, and indirect effects."
      claim_type: direct_evidence
      source_locator: "Geiger et al. 2025 / Definitions 44-48 and 52"
    standard_algorithms:
      statement: "Sequential actual-cause search and counterfactual contribution estimators already assign responsibility or credit to actions in POMDP-like trajectories; the candidate does not supply a new identification formula or estimator beyond these families."
      claim_type: agent_inference
      source_locator: "Triantafyllou et al. 2022 / Definitions 3.1-3.7 and Section 5; Schug et al. 2023 / Sections 3-4"
    evaluation_protocols:
      statement: "Mature evaluations include interchange-intervention accuracy, simulated trajectory responsibility in Team Goofspiel, ground-truth policy-gradient comparisons on long-horizon key-to-door and task-interleaving problems, and longitudinal mediation applications with explicit identification assumptions."
      claim_type: direct_evidence
      source_locator: "Geiger et al. 2025 / Definition 48; Triantafyllou et al. 2022 / Section 5; Schug et al. 2023 / Sections 4-5; Bind et al. 2016 / Sections 4-5"
  closest_cross_field_works:
    - paper_id: "JMLR2025_CAUSAL_ABSTRACTION"
      citation: "Geiger et al. Causal Abstraction: A Theoretical Foundation for Mechanistic Interpretability. JMLR 26, 2025; arXiv:2301.04709v4."
      field: "causal abstraction and mechanistic interpretability"
      stable_url: "https://jmlr.org/papers/v26/23-0058.html"
      body_evidence:
        statement: "Sections 2.5 and 3.4.1 define interchange, recursive interchange, and distributed interchange interventions, their accuracy, and total/direct/indirect effects; the paper explicitly casts causal mediation as an interchange-intervention analysis."
        claim_type: direct_evidence
        source_locator: "Definitions 44-48 and 52; Sections 2.5 and 3.4.1"
      overlap:
        statement: "Replacing one candidate stage with a controlled source value is an interchange intervention over a user-chosen high-level causal decomposition."
        claim_type: agent_inference
        source_locator: "body_evidence above; candidate abstract_decomposition.mechanism"
      code_boundary:
        statement: "The paper intervenes on model mechanisms and does not define evidence, repository state, patch action, and validation as separately executable environment interfaces."
        claim_type: direct_evidence
        source_locator: "paper Sections 2.5-3.5; candidate intervention_object above"
    - paper_id: "AIES2022_ACTUAL_CAUSALITY_DECPOMDP"
      citation: "Triantafyllou, Singla, and Radanovic. Actual Causality and Responsibility Attribution in Decentralized Partially Observable Markov Decision Processes. AIES 2022. DOI:10.1145/3514094.3534133."
      field: "sequential decision making and actual causality"
      stable_url: "https://doi.org/10.1145/3514094.3534133"
      body_evidence:
        statement: "Section 2.2 maps a fixed-policy Dec-POMDP trajectory to an SCM, Section 3 defines actual causes with counterfactual witnesses, and Section 5 compares causality and responsibility definitions on Team Goofspiel trajectories."
        claim_type: direct_evidence
        source_locator: "Sections 2.2, 3.1-3.7, and 5"
      overlap:
        statement: "It already formalizes ex-post causal attribution of sequential agent actions under partial observability and fixed policy context."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "Its intervention variables are agents' actions, not a typed chain spanning observation acquisition, derived internal state, code edit, and acceptance oracle."
        claim_type: direct_evidence
        source_locator: "paper Sections 2-3; candidate prior_delta"
    - paper_id: "NEURIPS2023_COCOA"
      citation: "Schug et al. Would I Have Gotten That Reward? Long-Term Credit Assignment by Counterfactual Contribution Analysis. NeurIPS 2023; arXiv:2306.16803v2."
      field: "reinforcement-learning credit assignment"
      stable_url: "https://arxiv.org/abs/2306.16803v2"
      body_evidence:
        statement: "Sections 3-4 define counterfactual contribution coefficients that ask whether a reward would still occur under another action, and Sections 4-5 evaluate bias, variance, and learning on key-to-door and task-interleaving environments with dynamic-programming ground truth."
        claim_type: direct_evidence
        source_locator: "Sections 3-5; Figure 1 and long-horizon evaluation figures"
      overlap:
        statement: "It removes novelty from generic counterfactual assignment of delayed success to an earlier action."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "It attributes reward to actions rather than testing which external agent-interface stage must be replaced to rescue the same failed checkpoint."
        claim_type: agent_inference
        source_locator: "paper objective; candidate prior_delta"
    - paper_id: "BIOSTATISTICS2016_LONGITUDINAL_MEDIATION"
      citation: "Bind et al. Causal Mediation Analysis for Longitudinal Data with Exogenous Exposure. Biostatistics 17(1), 2016. DOI:10.1093/biostatistics/kxv029."
      field: "causal inference and longitudinal mediation"
      stable_url: "https://doi.org/10.1093/biostatistics/kxv029"
      body_evidence:
        statement: "Sections 2-4 derive natural direct and indirect effects for longitudinal mediators and apply them to environmental-health data; Section 5 limits identification to settings without time-varying exposure-mediator confounding and with finite mediators."
        claim_type: direct_evidence
        source_locator: "Sections 2-5"
      overlap:
        statement: "It establishes that separating effects along ordered intermediate stages is a mature mediation problem with nontrivial identification assumptions."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "Its observational longitudinal setting lacks direct restoration and executable replacement of agent-interface stages, so it is a warning about identification rather than exact experimental coverage."
        claim_type: agent_inference
        source_locator: "paper Sections 2 and 5; candidate replay intervention"
  transfer_assessment:
    direct_transfer:
      statement: "As a causal method, the proposal is a direct transfer of interchange intervention plus sequential attribution; a four-entry rescue vector is not a new causal formalism or standard algorithm."
      claim_type: agent_inference
      source_locator: "maturity and closest_cross_field_works above"
    code_specific_structure:
      statement: "The defensible code-specific structure is a versioned executable artifact: repository and tool state can be restored, evidence and patches can be independently injected, and a broader hidden validator can score behavior beyond the agent's visible stop signal. This creates externally checkable stage variables rather than latent proxies, although replay alone is not unique to code."
      claim_type: agent_inference
      source_locator: "synthesis/cross-paper-synthesis.md / P2, P5, and P7; candidate intervention_object above"
    general_environment_substitutability:
      statement: "A sufficiently instrumented simulator could reproduce the causal design. The remaining contribution therefore depends on showing that executable program structure and intent-bounded validation expose a repeatable code-agent phenomenon that generic trajectory attribution does not predict."
      claim_type: agent_inference
      source_locator: "closest-work code boundaries; synthesis/cross-paper-synthesis.md / P7"
    residual_contribution:
      primary_class: new_causal_evidence
      conditional_secondary_class: new_phenomenon
      statement: "No new problem definition or mechanism remains. The narrowed contribution is only causal evidence that observationally identical code-agent loops have distinct, cross-scaffold rescue vectors; if established, that is a new phenomenon measured with mature causal machinery."
      claim_type: agent_inference
      source_locator: "prior_delta; maturity; code_specific_structure above"
    application_transfer_only:
      value: false
      statement: "The broad mechanism is transfer, but the narrowed claim is not merely rerunning an existing benchmark if it validates typed executable stages and independent intent outcomes; without both properties it collapses to application transfer and should be killed."
      claim_type: agent_inference
      source_locator: "code_specific_structure and general_environment_substitutability above"
  minimum_pilot:
    remains_direction_killing: true
    design:
      statement: "Use 30-50 deterministically restorable failures from two scaffolds, inject independently validated evidence, state/diagnosis, next-action, and validator substitutions at the same checkpoints, and compare rescue-vector prediction against trace labels on held-out repositories."
      claim_type: agent_inference
      source_locator: "candidate minimum_kill_validation above, narrowed by closest cross-field coverage"
    kill_criterion:
      statement: "Kill if restoration or intervention isolation fails, if stage effects are unstable or non-separable, if hidden validation cannot adjudicate alternative valid fixes, or if ordinary trajectory features predict held-out rescue equally well."
      claim_type: agent_inference
      source_locator: "candidate falsifiability above; longitudinal mediation identification boundary; Context-specific validation boundary in synthesis P7"
  decision:
    outcome: NARROW
    most_damaging_work: "JMLR2025_CAUSAL_ABSTRACTION"
    rationale:
      statement: "Component replacement, mediation, sequential actual causality, and counterfactual credit are mature, so no new attribution mechanism survives. Preserve only an empirical causal study of typed, executable code-agent stages and cross-scaffold rescue-vector heterogeneity."
      claim_type: agent_inference
      source_locator: "maturity, closest_cross_field_works, and transfer_assessment above"
    exact_delta:
      statement: "At a versioned repository checkpoint, test whether independently validated substitutions of acquired evidence, explicit derived diagnosis/state, executable next patch or tool action, and acceptance signal yield stable rescue vectors that distinguish otherwise matching loops and transfer across scaffolds."
      claim_type: agent_inference
      source_locator: "code_specific_structure and residual_contribution above"
    confidence:
      level: medium
      statement: "Coverage of the causal machinery is high confidence, but no inspected cross-field work used the exact four external code-agent interfaces and the construct validity of clean stage isolation remains unverified."
      claim_type: agent_inference
      source_locator: "closest-work code boundaries and minimum_pilot.kill_criterion"
    unverified_information:
      - statement: "Deterministic restoration of proprietary or asynchronous coding-agent state at all four interfaces has not been verified."
        claim_type: agent_inference
        source_locator: "candidate replay requirement"
      - statement: "Independent intent adjudication for alternative valid patches remains unresolved; hidden tests are broader supervision, not complete user intent."
        claim_type: agent_inference
        source_locator: "synthesis/cross-paper-synthesis.md / P7"
      - statement: "The search did not establish absence of an exact four-interface study and makes no novelty-first claim."
        claim_type: agent_inference
        source_locator: "AGENTS.md / Evidence and Claims"
    carry_forward_to_direction_narrowing: true
direction_narrowing_targeted_verification:
  checked_at: "2026-07-26"
  works:
    - paper_id: "ARXIV_2605_04624"
      citation: "Hu et al. AuditRepairBench: A Paired-Execution Trace Corpus for Evaluator-Channel Ranking Instability in Agent Repair. arXiv:2605.04624v1, 2026."
      stable_url: "https://arxiv.org/abs/2605.04624v1"
      relation: partial_overlap
      body_evidence:
        statement: "The study holds task, candidate set, tool outputs, and final evaluator fixed while blocking evaluator-derived selector inputs; it validates 80 source-level channel-surgery cases and explicitly disclaims latent-mechanism certification and strong prospective validity."
        claim_type: direct_evidence
        source_locator: "paper Sections 1, 3, 6, and 13"
      decision_effect:
        statement: "Paired code-agent channel surgery is already a direct SE protocol, so the finalist must demonstrate four-interface rescue-profile heterogeneity rather than claim paired intervention or evaluator-path blocking as new."
        claim_type: agent_inference
        source_locator: "body_evidence above; cross_field_attack.decision.exact_delta"
    - paper_id: "ICML2023_DYNAMIC_MEDIATION_RL"
      citation: "Ge et al. A Reinforcement Learning Framework for Dynamic Mediation Analysis. ICML 2023; arXiv:2301.13348v2."
      stable_url: "https://arxiv.org/abs/2301.13348v2"
      relation: cross_field_method_coverage
      body_evidence:
        statement: "The paper defines a mediated MDP and decomposes policy effects into immediate direct, immediate mediation, delayed direct, and delayed mediation effects, with identification assumptions and multiply robust estimators."
        claim_type: direct_evidence
        source_locator: "paper Sections 3-6"
      decision_effect:
        statement: "Sequential mediators and delayed effects are mature; no new mediation formulation remains in the stagewise direction."
        claim_type: agent_inference
        source_locator: "body_evidence above; cross_field_attack.maturity"
  disposition:
    outcome: FINALIST_NARROW
    finalist_id: FINALIST_STAGEWISE_CAUSAL_RESCUE_PROFILES
    exact_delta:
      statement: "Retain only empirical causal evidence that observationally matched coding-agent loops have reproducible, heterogeneous rescue profiles over independently controlled evidence, derived-state, executable-action, and validation interfaces, with replication beyond one scaffold and model family."
      claim_type: agent_inference
      source_locator: "directions/direction-narrowing-comparison.md / Stagewise failure attribution as a standalone paper"
    prohibited_claim:
      statement: "Do not claim a new causal estimator, mediation definition, interchange intervention, actual-cause definition, paired channel-surgery protocol, failure taxonomy, or recovery-window concept."
      claim_type: agent_inference
      source_locator: "directions/novelty-boundary.md / Stagewise finalist: prohibited claims"
