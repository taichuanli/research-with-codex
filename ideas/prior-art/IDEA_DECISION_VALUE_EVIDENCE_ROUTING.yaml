schema_version: 3
phase: PRIOR_ART_ATTACK_CROSS_FIELD
idea_id: "IDEA_DECISION_VALUE_EVIDENCE_ROUTING"
review_status: complete
candidate_decomposition:
  research_question:
    statement: "Which optional observation should an agent acquire when its value is defined by changing the best downstream action rather than reducing uncertainty alone?"
    claim_type: agent_inference
    source_locator: "ideas/IDEA_DECISION_VALUE_EVIDENCE_ROUTING.yaml / falsifiable_hypothesis"
  core_mechanism:
    statement: "Estimate paired with/without-observation action change and outcome advantage, discount it by acquisition reliability and cost, and route only positive-value calls."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_DECISION_VALUE_EVIDENCE_ROUTING.yaml / core_mechanism"
  intervention_object:
    statement: "Optional tests, executions, analyzers, retrievals, or structured queries before the next agent action."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_DECISION_VALUE_EVIDENCE_ROUTING.yaml / research_object and intervention_layer"
  experimental_claim:
    statement: "Action-mediated, reliability-aware routing should beat fixed access, relevance, entropy, and generic tool-choice baselines under equal budgets across two agent settings."
    claim_type: agent_inference
    source_locator: "ideas/IDEA_DECISION_VALUE_EVIDENCE_ROUTING.yaml / minimum_kill_validation"
search_log:
  - searched_at: "2026-07-25"
    query_families:
      - "value of information tool using LLM agent"
      - "inference-time budget control search agent VOI"
      - "adaptive tool invocation uncertainty cost agent"
      - "when not to call tools clarification abstention"
      - "epistemic necessity external tools"
    sources: [arXiv, OpenAlex]
    source_locator: "https://export.arxiv.org/api/query?search_query=all:%22value%20of%20information%22%20AND%20(all:%22agent%22%20OR%20all:%22tool%22)"
    result:
      statement: "The search found two direct VOI controllers: one chooses retrieval/decomposition/commit actions by task-level marginal value, and one chooses information sources and stopping by belief-dependent VOI, signal quality, and live cost."
      claim_type: direct_evidence
      source_locator: "query above; full texts of arXiv:2605.05701v1 and arXiv:2603.30031v3"
  - searched_at: "2026-07-25"
    query_families:
      - "backward chain through Toolformer, When2Call, Self-Regulation"
      - "formal and later-version audit"
    sources: [paper_reference_lists, OpenAlex, arXiv, ACL_Anthology]
    source_locator: "arXiv:2605.05701v1 / Related Work; arXiv:2603.30031v3 / Section 2; https://doi.org/10.18653/v1/2025.naacl-long.174"
    result:
      statement: "Backward chaining confirmed dense prior art on when-to-call, tool necessity, assistance requests, and model/tool routing. When2Call has a formal NAACL 2025 version; TCA is at v3."
      claim_type: direct_evidence
      source_locator: "source locators above; PDF version headers"
works:
  - paper_id: "ARXIV_2605_05701"
    citation: "Fang et al. Inference-Time Budget Control for LLM Search Agents. arXiv:2605.05701v1, 2026."
    stable_url: "https://arxiv.org/abs/2605.05701v1"
    version_status: "recent_preprint_v1"
    relation: direct_coverage
    body_evidence:
      statement: "The controller assigns every feasible retrieval, decomposition, or answer-commit action a task-level VOI score using critic-derived value change, structure, cost normalization, budget penalty, and guards; four benchmarks, three backbones, and four budgets show aggregate gains, with search-time control dominant in ablation."
      claim_type: direct_evidence
      source_locator: "paper Sections 1, 3, 4, and 6; Figure 2; main-results and ablation tables"
    coverage:
      statement: "It directly covers prospective per-state action allocation by marginal task value under hard tool and token budgets."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "Its VOI is a critic-based operational surrogate and does not label whether the returned observation causally changes the identity of the best next action."
      claim_type: agent_inference
      source_locator: "paper Section 4 VOI definition; candidate core mechanism"
    required_action: narrow
  - paper_id: "ARXIV_2603_30031"
    citation: "Di Gioia. Cognitive Friction: A Decision-Theoretic Framework for Bounded Deliberation in Tool-Using Agents. arXiv:2603.30031v3, 2026."
    stable_url: "https://arxiv.org/abs/2603.30031v3"
    version_status: "recent_preprint_v3"
    relation: direct_coverage
    body_evidence:
      statement: "TCA selects which noisy information source to query and when to stop using rollout-estimated belief-dependent VOI, tool signal quality, congestion, and latency; controlled EMDG and NSTG experiments show selection and stopping must be optimized jointly."
      claim_type: direct_evidence
      source_locator: "paper Sections 3.1-3.4 and 4.4-4.7; Equations 6-7; Tables 2-4"
    coverage:
      statement: "It directly covers VOI-based source choice, reliability through tool signal models, cost, and stopping."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "Its VOI is entropy reduction in synthetic belief-state environments rather than action-mediated value in code agents."
      claim_type: direct_evidence
      source_locator: "paper Section 3.4 and Section 4 environment definitions"
    required_action: narrow
  - paper_id: "NAACL2025_WHEN2CALL"
    citation: "Ross, Mahabaleshwarkar, and Suhara. When2Call: When (not) to Call Tools. NAACL 2025. DOI:10.18653/v1/2025.naacl-long.174."
    stable_url: "https://doi.org/10.18653/v1/2025.naacl-long.174"
    version_status: "formal_conference_paper"
    relation: partial_overlap
    body_evidence:
      statement: "When2Call distinguishes direct answer, tool call, follow-up question, and inability, and reward-aware preference optimization materially improves the decision while retaining BFCL tool-call ability."
      claim_type: direct_evidence
      source_locator: "paper Sections 2-4; Tables 1-3"
    coverage:
      statement: "It removes generic novelty for deciding whether to call a tool, ask for missing information, or abstain."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "It does not compare the value of alternative returned observations within a trajectory."
      claim_type: agent_inference
      source_locator: "paper task definition"
    required_action: narrow
  - paper_id: "ARXIV_2502_04576"
    citation: "Min et al. Self-Regulation and Requesting Interventions. arXiv:2502.04576v1, 2025."
    stable_url: "https://arxiv.org/abs/2502.04576v1"
    version_status: "preprint_v1"
    relation: partial_overlap
    body_evidence:
      statement: "The method treats help versus no-help as a state action, learns transition and process-reward models, and uses dynamic programming to select interventions under explicit usage budgets."
      claim_type: direct_evidence
      source_locator: "paper Sections 4-6; Equations for help/no-help dynamic programming; Tables 2-4"
    coverage:
      statement: "It directly covers budgeted prospective intervention requests using estimated success improvement."
      claim_type: agent_inference
      source_locator: "body_evidence above"
    uncovered:
      statement: "It routes assistance types rather than scoring the causal decision value and replay reliability of a returned observation."
      claim_type: agent_inference
      source_locator: "paper action space and candidate novelty delta"
    required_action: compare
decision:
  outcome: NARROW
  most_damaging_work: "ARXIV_2605_05701"
  rationale:
    statement: "Generic VOI routing, cost-aware source choice, when-to-call, and stopping are already directly covered. The candidate can retain only paired causal observation value defined through a changed best downstream action plus measured acquisition/replay reliability in software-agent environments."
    claim_type: agent_inference
    source_locator: "works above"
  covered_problem:
    statement: "Choosing whether and which tool or information source to query under a limited budget is covered."
    claim_type: agent_inference
    source_locator: "ARXIV_2605_05701; ARXIV_2603_30031; NAACL2025_WHEN2CALL"
  covered_mechanism:
    statement: "Task-level VOI scoring, entropy-based VOI, cost/reliability pricing, assistance policies, and call/stop classifiers are covered."
    claim_type: agent_inference
    source_locator: "all works above"
  covered_experiment:
    statement: "Fixed-budget routing across several backbones and benchmarks, plus component ablations for selection and stopping, is covered."
    claim_type: agent_inference
    source_locator: "ARXIV_2605_05701; ARXIV_2603_30031"
  novelty_delta:
    statement: "For optional code-agent evidence at a restored checkpoint, estimate from paired access/withholding branches whether the realized observation changes the argmax next action and improves independently validated outcome, then discount that effect by empirical acquisition/replay failure rather than model uncertainty alone."
    claim_type: agent_inference
    source_locator: "uncovered fields above"
  falsifiability:
    status: retained
    statement: "The narrowed claim fails if paired labels are unstable, action change does not mediate outcome, or existing task-level VOI matches it out of repository."
    claim_type: agent_inference
    source_locator: "candidate minimum_kill_validation narrowed by prior art"
  reviewer_rejection:
    statement: "The likely rejection is that the method is Inference-Time Budget Control with software tools, unless returned-observation action mediation and replay reliability are directly isolated."
    claim_type: agent_inference
    source_locator: "ARXIV_2605_05701 coverage"
  confidence:
    level: high
    statement: "Two 2026 papers directly occupy VOI-based action selection and source choice; the remaining causal mediation distinction is precise but narrow."
    claim_type: agent_inference
    source_locator: "ARXIV_2605_05701; ARXIV_2603_30031"
  unverified_information:
    - statement: "Whether paired observation-value labels transfer across tool schemas remains unverified."
      claim_type: agent_inference
      source_locator: "candidate maximum_risk"
  carry_forward_to_cross_field_attack: true
cross_field_attack:
  attacked_at: "2026-07-26"
  prior_delta:
    statement: "The direct-attack remainder uses paired observation access and withholding to estimate whether a realized code-agent observation changes the argmax next action and improves an independently validated outcome after reliability and cost."
    claim_type: direct_evidence
    source_locator: "decision.novelty_delta above"
  abstract_decomposition:
    problem:
      statement: "Choose which costly observation to acquire in a partially observed decision process when its value is the increase in maximum expected downstream utility after conditioning on the observation."
      claim_type: agent_inference
      source_locator: "candidate_decomposition above; Krause and Guestrin 2009 / Section 2"
    mechanism:
      statement: "Represent sensing or feature acquisition as an action, update the belief after the returned observation, compare the best achievable utility before and after observation, and select observations or stopping under cost or budget constraints."
      claim_type: agent_inference
      source_locator: "Krause and Guestrin 2009 / Equations 1-2 and Section 2.2; Janisch et al. 2019 / Problem Definition; Spaan and Lima 2009 / POMDP model"
  search_log:
    - searched_at: "2026-07-26"
      query_families:
        - "decision theoretic value of information costly observation"
        - "active sensing POMDP observation action utility"
        - "costly feature acquisition adaptive classification"
        - "dynamic sensor selection belief state reward"
      sources: [OpenAlex, JAIR, AAAI, ICAPS, full_text]
      source_locator: "https://api.openalex.org/works?search=decision%20theoretic%20value%20information%20costly%20observation%20active%20sensing%20feature%20acquisition%20POMDP; full texts for the three closest works below"
      result:
        statement: "The search found established formulations for subset and adaptive VOI, POMDP active sensing, dynamic sensor selection, and costly feature acquisition; the decisive definitions, algorithms, and experiments were verified in the paper bodies."
        claim_type: direct_evidence
        source_locator: "Krause and Guestrin 2009 / Sections 2-6; Janisch et al. 2019 / Problem Definition and experiments; Spaan and Lima 2009 / POMDP model and experiments"
  adjacent_terminology:
    statement: "Adjacent fields call this decision-theoretic value of information, Bayesian experimental design, active sensing or sensor management, adaptive feature acquisition, conditional observation planning, and POMDP observation control."
    claim_type: agent_inference
    source_locator: "closest_cross_field_works below"
  maturity:
    mathematical_form:
      statement: "Decision-theoretic VOI already defines an observation's worth through the maximum expected utility of the best action after conditioning on it, not merely entropy reduction; adaptive plans and explicit observation penalties or budgets are standard."
      claim_type: direct_evidence
      source_locator: "Krause and Guestrin 2009 / Equations 1-2, decision-theoretic VOI subsection, and Section 2.2"
    standard_algorithms:
      statement: "Established algorithms include dynamic programming for optimal conditional observation plans in chain graphical models, Q-learning over acquire-or-decide actions, and belief-state POMDP policies for nonmyopic sensor selection."
      claim_type: direct_evidence
      source_locator: "Krause and Guestrin 2009 / Sections 4.1-4.2 and Algorithms 1-3; Janisch et al. 2019 / Equations 1-5; Spaan and Lima 2009 / POMDP controller"
    evaluation_protocols:
      statement: "The literature reports utility-cost or accuracy-cost frontiers, fixed budgets, adaptive versus static or heuristic policies, and out-of-sample task performance on sensor networks, NLP and bioinformatics data, eight costly-feature datasets, and a physical ten-camera network."
      claim_type: direct_evidence
      source_locator: "Krause and Guestrin 2009 / Sections 6-7; Janisch et al. 2019 / Figure 2 and Tables 1-2; Spaan and Lima 2009 / Tables 1-2 and Figure 4"
  closest_cross_field_works:
    - paper_id: "JAIR2009_OPTIMAL_VOI"
      citation: "Krause and Guestrin. Optimal Value of Information in Graphical Models. JAIR 35, 2009. DOI:10.1613/jair.2737."
      field: "decision analysis and probabilistic graphical models"
      stable_url: "https://doi.org/10.1613/jair.2737"
      body_evidence:
        statement: "Section 2, Equations 1-2 formalize open-loop subset and adaptive conditional-plan observation selection; the decision-theoretic subsection defines reward as maximum expected utility over actions after observation, Section 2.2 adds cost or budgets, and later sections provide algorithms, hardness results, and real-data evaluations."
        claim_type: direct_evidence
        source_locator: "Sections 2-4 and 6-7; Equations 1-2; Algorithms 1-4"
      overlap:
        statement: "Whether an observation changes the utility-maximizing action and improves expected outcome is the canonical decision-theoretic VOI objective."
        claim_type: agent_inference
        source_locator: "paper decision-theoretic VOI definition; candidate prior_delta"
      code_boundary:
        statement: "Paired code-agent replay can estimate an instance-level realized effect without a known probabilistic model, but it does not define a different value criterion."
        claim_type: agent_inference
        source_locator: "candidate paired-access design; paper Sections 2-4"
    - paper_id: "AAAI2019_COSTLY_FEATURES_DRL"
      citation: "Janisch, Pevny, and Lisy. Classification with Costly Features Using Deep Reinforcement Learning. AAAI 2019. DOI:10.1609/aaai.v33i01.33013959."
      field: "adaptive feature acquisition and reinforcement learning"
      stable_url: "https://doi.org/10.1609/aaai.v33i01.33013959"
      body_evidence:
        statement: "The Problem Definition casts each feature request or terminal classification as a POMDP action, gives acquisition cost as negative reward and misclassification as terminal loss in Equations 1-2, and evaluates cost-accuracy tradeoffs across eight public datasets."
        claim_type: direct_evidence
        source_locator: "Problem Definition; Equations 1-5; Figure 2; evaluation tables"
      overlap:
        statement: "It directly covers adaptive observation acquisition conditioned on observed values and downstream decision quality under cost."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "Code-agent observations are structured tool results rather than static features, but the acquire-versus-act action space and utility-cost objective remain the same POMDP pattern."
        claim_type: agent_inference
        source_locator: "paper Problem Definition; candidate intervention_object"
    - paper_id: "ICAPS2009_DYNAMIC_SENSOR_SELECTION"
      citation: "Spaan and Lima. A Decision-Theoretic Approach to Dynamic Sensor Selection in Camera Networks. ICAPS 2009. DOI:10.1609/icaps.v19i1.13381."
      field: "active sensing, planning, and robotics"
      stable_url: "https://doi.org/10.1609/icaps.v19i1.13381"
      body_evidence:
        statement: "The paper models belief-dependent camera activation as a closed-loop nonmyopic POMDP, uses observation and transition models plus task rewards for coverage or uncertainty, and compares POMDP, QMDP, static, and heuristic selectors on a real ten-camera network."
        claim_type: direct_evidence
        source_locator: "Background and POMDP model; Dynamic sensor selection; Tables 1-2; Figure 4"
      overlap:
        statement: "It establishes mature active sensing where observations are noisy, source choice is adaptive, and utility is task-dependent rather than purely informational."
        claim_type: agent_inference
        source_locator: "body_evidence above"
      code_boundary:
        statement: "Tests and analyzers offer different observation semantics and replay failure modes, but sensor observation models already represent reliability and action-dependent information."
        claim_type: agent_inference
        source_locator: "paper POMDP observation model; candidate reliability discount"
  transfer_assessment:
    direct_transfer:
      statement: "The proposed routing rule is decision-theoretic VOI with code tools as sensing actions. Paired access and withholding is an empirical estimator or evaluation design for VOI, not a new problem definition or routing mechanism."
      claim_type: agent_inference
      source_locator: "maturity and closest_cross_field_works above"
    code_specific_structure:
      statement: "Code environments provide typed executable observations, measurable flakiness or replay failure, inspectable downstream edits, and hidden behavioral tests. These improve label auditability but map directly to observation models, action utilities, and validation rewards."
      claim_type: agent_inference
      source_locator: "candidate prior_delta; active-sensing formulations above; synthesis/cross-paper-synthesis.md / P1-P2"
    general_environment_substitutability:
      statement: "Robotics, sensor networks, medical diagnosis, web agents, or any instrumented POMDP can replace the code tools while preserving acquisition, belief update, argmax action change, cost, reliability, and outcome utility."
      claim_type: agent_inference
      source_locator: "Krause and Guestrin applications; Janisch et al. domains; Spaan and Lima experiment"
    residual_contribution:
      primary_class: only_application_transfer
      statement: "No new phenomenon, formal problem, mechanism, causal estimand, or code-only applicability boundary remains; the exact paired protocol would benchmark mature VOI on software-agent data."
      claim_type: agent_inference
      source_locator: "direct_transfer, code_specific_structure, and general_environment_substitutability above"
    application_transfer_only:
      value: true
      statement: "Independent hidden tests make utility measurement stronger but do not distinguish the routing principle from standard active sensing or adaptive feature acquisition."
      claim_type: agent_inference
      source_locator: "residual_contribution above"
  minimum_pilot:
    remains_direction_killing: true
    design:
      statement: "A 50-100 checkpoint paired-replay feasibility study could test whether observation effects are repeatable and whether a learned empirical VOI estimate beats always, never, and task-level VOI under equal cost."
      claim_type: agent_inference
      source_locator: "candidate minimum_kill_validation above, reduced after cross-field coverage"
    kill_criterion:
      statement: "Kill the transfer empirically if replay labels are unstable or standard VOI baselines match it; even a positive result cannot restore a non-transfer contribution without a code-specific decision structure absent from the current candidate."
      claim_type: agent_inference
      source_locator: "candidate falsifiability above; transfer_assessment"
  decision:
    outcome: KILL
    most_damaging_work: "JAIR2009_OPTIMAL_VOI"
    rationale:
      statement: "Decision-mediated observation value, adaptive acquisition, noisy sensing, cost, and stopping are mature outside software engineering. The paired code replay is a measurement implementation of VOI, and code-specific supervision does not change the formal decision problem."
      claim_type: agent_inference
      source_locator: "maturity and transfer_assessment above"
    exact_delta:
      statement: "No standalone delta remains; at most there is a code-agent VOI benchmark with unusually auditable actions and outcomes."
      claim_type: agent_inference
      source_locator: "residual_contribution above"
    confidence:
      level: high
      statement: "The closest work explicitly defines observation value through maximum expected action utility and includes adaptive, cost-aware, noisy, and real-system evaluations."
      claim_type: agent_inference
      source_locator: "closest_cross_field_works above"
    unverified_information:
      - statement: "The sample complexity and stability of realized per-checkpoint VOI labels for stochastic language agents remain unverified, but affect feasibility rather than novelty."
        claim_type: agent_inference
        source_locator: "candidate maximum_risk"
      - statement: "No exhaustive search of every 2026 web-agent routing preprint was possible; the mature pre-LLM formal coverage is sufficient for the transfer decision."
        claim_type: agent_inference
        source_locator: "search_log and cross-field works"
    carry_forward_to_direction_narrowing: false
