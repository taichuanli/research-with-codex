      source: "reports/cross-venue-corpus-audit-report.json / links_and_follow_up"
      statement: "396 official external targets are retained as not_fetched, 13 official link labels remain unclassified, and three ASE records retain UNCLASSIFIED_TITLE_AND_ABSTRACT for FIELD_MAPPING reconciliation."
