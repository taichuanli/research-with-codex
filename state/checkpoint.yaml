completed_items:
  - "Created the durable directory structure for corpus, cards, synthesis, ideas, directions, configuration, reports, scripts, and state."
  - "Recorded session protocol, research scope, selection policy, provisional taxonomy, and reusable templates."
  - "CORPUS_BUILD_ICSE2026: captured 321 official ICSE 2026 Research Track accepted-paper records from the official Accepted Papers listing and its official per-paper detail pages."
  - "CORPUS_BUILD_ICSE2026: recorded titles, authors, venue/track, official detail URLs, all 321 official abstracts, source locators and access times, provisional title-and-abstract taxonomy assignments, and access status in corpus/icse2026-research-track.jsonl."
  - "CORPUS_BUILD_ICSE2026: validated 100% official-list coverage, unique IDs, JSON/JSONL parseability, source fields, and title/title-plus-author/DOI duplicate checks; results are in corpus/icse2026-research-track-dedup-audit.json and reports/icse2026-corpus-build-report.json."
  - "CORPUS_BUILD_ICSE2026: no external artifact, code, or data links were listed by the official records; 130 DOI or preprint targets were retained but not fetched, which is non-blocking for the completed official-list corpus inventory."
  - "CORPUS_BUILD_FSE2026: captured 211 official FSE 2026 Research Papers records from the official Accepted Papers listing and all 211 official per-paper detail pages."
  - "CORPUS_BUILD_FSE2026: recorded titles, authors, venue/track, official detail URLs, all 211 official abstracts, source locators and access times, official DOI/publisher, paper, preprint, media, artifact, code, data, and unclassified-link fields, plus provisional title-and-abstract taxonomy assignments in corpus/fse2026-research-papers.jsonl."
  - "CORPUS_BUILD_FSE2026: validated 100% official-list coverage, unique IDs and official event IDs, JSON/JSONL parseability, title/author/raw-link equality with the official baseline, source-field conflicts, and title/title-plus-author/DOI duplicate checks; results are in corpus/fse2026-research-papers-dedup-audit.json and reports/fse2026-research-papers-corpus-build-report.json."
  - "CORPUS_BUILD_FSE2026: no official artifact, code, or data links were explicitly labelled; 187 external targets were retained but not fetched, and eight File Attached plus one Authorizer link remain unclassified by their official labels. These are non-blocking for the official-list corpus inventory."
  - "CORPUS_BUILD_ISSTA2026: captured 210 official ISSTA 2026 Research papers records from the official Accepted Papers listing and all 210 official per-paper detail pages."
  - "CORPUS_BUILD_ISSTA2026: recorded titles, authors, venue/track, official detail URLs, all 210 official abstracts, source locators and access times, and every official DOI/publisher, paper, preprint, artifact, code, data, media, or unclassified-link field in corpus/issta2026-research-papers.jsonl."
  - "CORPUS_BUILD_ISSTA2026: validated 100% official-list coverage, unique IDs and official event IDs, JSON/JSONL parseability, title/author/raw-link equality with the official baseline, source-field conflicts, and title/title-plus-author/DOI duplicate checks; results are in corpus/issta2026-research-papers-dedup-audit.json and reports/issta2026-research-papers-corpus-build-report.json."
  - "CORPUS_BUILD_ISSTA2026: the official records listed four preprints and one Media Attached target, retained but not fetched; they listed no DOI, paper/PDF, artifact, code, data, or unclassified links. These are non-blocking for the official-list corpus inventory."
  - "CORPUS_BUILD_ASE2025: captured 246 official ASE 2025 Research Papers records from the official Accepted Papers listing and all 246 official per-paper detail pages."
  - "CORPUS_BUILD_ASE2025: recorded titles, authors, venue/track, official detail URLs, all 246 official abstracts, source locators and access times, all official DOI/publisher, formal-paper, preprint, media, artifact, code, data, and unclassified-link fields, plus provisional title-and-abstract taxonomy assignments in corpus/ase2025-research-papers.jsonl."
  - "CORPUS_BUILD_ASE2025: validated 100% official-list coverage, unique IDs and official event IDs, JSON/JSONL parseability, title/author/raw-link equality with the official baseline, source-field conflicts, and title/title-plus-author/DOI duplicate checks; results are in corpus/ase2025-research-papers-dedup-audit.json and reports/ase2025-research-papers-corpus-build-report.json."
  - "CORPUS_BUILD_ASE2025: the official records listed three DOI targets, five publication targets, 54 preprints, eight Media Attached targets, and four File Attached targets. Targets were retained but not fetched; no artifact, code, or data links were explicitly labelled, and the four File Attached targets remain unclassified by their official labels. These are non-blocking for the official-list corpus inventory."
  - "CORPUS_AUDIT: reconciled the four official baselines, four local corpora, four per-venue dedup audits, and four build reports. ICSE 2026, FSE 2026, ISSTA 2026, and ASE 2025 have 321, 211, 210, and 246 matched records respectively (988 total; 100% baseline coverage)."
  - "CORPUS_AUDIT: generated corpus/cross-venue-research-paper-index.jsonl and reports/cross-venue-corpus-audit-report.json. The index retains venue, track, year, source records, and original JSONL path/line locators without modifying the four source corpora."
  - "CORPUS_AUDIT: found no cross-venue exact normalized title-plus-author, shared DOI, shared external URL, title-variant, or formal/preprint double-count candidate, and no track-scope mismatch. Fourteen high-similarity author-roster pairs remain explicitly marked as candidates rather than duplicate findings."
  - "FIELD_MAPPING: replaced the provisional seven-bucket taxonomy with 11 primary SE problem domains plus an explicit CROSS_CUTTING_OR_UNCERTAIN state, 29 major subtopics, and independent multi-label dimensions for research object, method/mechanism, evaluation, and resource/artifact contribution."
  - "FIELD_MAPPING: classified all 988 papers from official titles and abstracts in synthesis/field-mapping-paper-assignments.jsonl; reconciled all three prior ASE UNCLASSIFIED_TITLE_AND_ABSTRACT records and retained one cross-cutting ICSE paper without a forced primary-domain assignment."
  - "FIELD_MAPPING: generated a count-and-percentage cross-venue matrix, machine-readable totals and intersections, an evidence index, and reports that distinguish direct counts, author claims, and agent interpretations."
  - "FIELD_MAPPING: selected 11 topic clusters for the later deep-reading selection phase without proposing research ideas, asserting novelty, or claiming a research gap."
  - "DEEP_READING_SELECTION: selected 42 unique papers from the 988-paper corpus, with six primary papers for each of seven requested mechanism clusters and no author appearing on more than two selections."
  - "DEEP_READING_SELECTION: split the plan into two 21-paper batches; each batch contains exactly three papers from every mechanism cluster, and all Batch 1 papers have a verified public full-text URL."
  - "DEEP_READING_SELECTION: recorded per-paper reasons, mechanisms, topic roles, deep-reading questions, evaluation families, coverage roles, full-text status, 19 important exclusions, and explicit phase boundaries without full-paper reading or idea generation."
  - "DEEP_READING_BATCH_1: fully read and created structured YAML cards for all 21 assigned papers, with exactly three papers in each of seven mechanism clusters."
  - "DEEP_READING_BATCH_1: recorded paper-level problems, prior-method limitations, mechanisms, assumptions, datasets, baselines, metrics, ablations, result locators, limitations, failure modes, artifacts, within-cluster differences, and relevance reassessments using the required claim types."
  - "DEEP_READING_BATCH_1: synthesized online versus offline intervention, signal-to-decision evidence, shared assumptions, empirical/method consistency, contradictions, and unresolved evidence in synthesis/deep-reading-batch-1-synthesis.md."
  - "DEEP_READING_BATCH_1: created a nine-paper cross-domain dLLM watchlist without adding a new equal-weight cluster or claiming superiority over autoregressive models."
  - "DEEP_READING_BATCH_2: completed structured evidence cards for all 21 assigned papers, with exactly three papers per mechanism cluster; 13 cards use full manuscripts, seven use official abstracts plus inspectable artifacts, and one uses an official abstract and publisher record only."
  - "DEEP_READING_BATCH_2: re-evaluated all five Batch 1 findings and explicitly overturned the literal offline-prevalence claim, strongly supported three findings with sharper boundaries, and replaced a universal recovery bottleneck with a staged constraint chain."
  - "DEEP_READING_BATCH_2: completed a 42-row cross-paper comparison of signal source, availability, offline/online use, affected decisions, causal status, validation, assumptions, failure boundaries, and reusable assets."
  - "DEEP_READING_BATCH_2: updated all seven mechanism-cluster syntheses on the basis of 42 cards and preserved cross-cluster contradictions, evidence gaps, value shifts, and version/data inconsistencies without generating a research idea."
  - "DEEP_READING_BATCH_2: fully read six targeted dLLM manuscripts and limited transferable evidence to token/block commitment granularity, arbitrary-location infilling, and diffusion-native outcome training; no repository-agent control or general autoregressive-superiority claim was found."
  - "CROSS_PAPER_SYNTHESIS: created a 42-row unified mechanism matrix covering signal, availability, affected decision, online/offline use, causal status, feedback channels, validation, assumptions, failure boundaries, assets, and access-weighted evidence."
  - "CROSS_PAPER_SYNTHESIS: organized the evidence-acquisition, state-localization, action-selection, and intent-validation chain; preserved six cross-paper contradictions and identified missing connections without selecting a preferred direction."
  - "CROSS_PAPER_SYNTHESIS: recorded shared assumptions, evidence weaknesses, reusable assets, and nine research pressure points, each limited to the observed tension, closest work, unresolved question, and evidence needed."
  - "CROSS_PAPER_SYNTHESIS: retained dLLMs as an adjacent observation axis for commitment granularity, infilling, and diffusion-native training; no core-cluster promotion, AR-superiority claim, complete idea, method, or experiment was produced."
  - "IDEA_SEEDING: generated ten falsifiable research seeds directly from the nine pressure points: three low-cost empirical laws, four state/action/feedback/recovery controls, two training or internal-representation directions, and one dLLM mechanism intersection."
  - "IDEA_SEEDING: recorded for every seed its cross-paper evidence, closest reviewed work, pending novelty delta, object, intervention layer, mechanism, minimum kill test, three-way result interpretation, resources and cost, general-agent significance, risks, rejection reason, and five separate ranking dimensions."
  - "IDEA_SEEDING: performed only three narrow obvious-overlap searches and narrowed generic tool selection, counterfactual credit, and diffusion repair claims; systematic direct prior-art attack was not started."
  - "IDEA_SEEDING: retained no novelty claim, final direction, implementation, training run, or formal experiment; the ten candidates remain attackable seeds."
  - "PRIOR_ART_ATTACK_DIRECT: decomposed and searched all ten candidates through multiple synonym families, inspected direct competitors and recent preprints in full text or the strongest available formal evidence, and audited backward references, forward citations, and later versions."
  - "PRIOR_ART_ATTACK_DIRECT: recorded 43 closest-work entries and issued exactly one allowed decision per candidate: five KILL, one MERGE, two NARROW, one PIVOT, and one SURVIVES_DIRECT_ATTACK."
  - "PRIOR_ART_ATTACK_DIRECT: retained four altered candidates for cross-field attack, saved ten complete ledgers and reports/prior-art-direct-attack-report.md, and did not generate a new candidate, select a direction, train a model, or run an experiment."
  - "PRIOR_ART_ATTACK_CROSS_FIELD: decomposed the four direct-stage carry-forward deltas into adjacent-field problems and mechanisms, inspected 15 closest full-text works across causal inference, RL, planning, control, active sensing, feature acquisition, model explanation, and NLP, and recorded body-level definitions, assumptions, algorithms, and evaluations."
  - "PRIOR_ART_ATTACK_CROSS_FIELD: issued exactly one decision per candidate: NARROW for stagewise failure attribution and counterfactual evidence memory audit, and KILL for actionable recoverability calibration and decision-value evidence routing because only application transfer remained."
  - "PRIOR_ART_ATTACK_CROSS_FIELD: saved four schema-3 ledgers and reports/prior-art-cross-field-attack-report.md, retained two pilot-killable code-specific boundaries for direction narrowing, and did not revive a candidate, generate an idea, select a final direction, or begin an experiment."
  - "DIRECTION_NARROWING: compared stagewise failure attribution, counterfactual evidence memory audit, and a unified code-agent causal trajectory auditing umbrella using symmetric research-question, novelty, contribution, executable-structure, rejection, transfer, and positive/negative-result criteria."
  - "DIRECTION_NARROWING: retained one finalist, FINALIST_STAGEWISE_CAUSAL_RESCUE_PROFILES, only as conditional new causal evidence and a possible new phenomenon; killed the standalone memory audit as application transfer after targeted belief-update, truth-maintenance, attribution, corruption, and provenance checks; and rejected the merge for lacking one estimand."
  - "DIRECTION_NARROWING: saved directions/direction-narrowing-comparison.md, directions/novelty-boundary.md, and directions/minimum-kill-pilot.md with hard continue/kill thresholds; no pilot, implementation, task download, model call, training, or formal experiment was started."
  - "INDEPENDENT_DIRECTION_AUDIT: ruled REVISE_BEFORE_PILOT and kept pilot_authorized false because the prior substitutions estimated overlapping downstream assistance rather than endogenous bottlenecks, used harmful controls in the primary contrast, lacked frozen native contracts and leak/intent rules, and underpowered transfer claims."
  - "DIRECTION_REVISION: fixed the sole estimand as oracle-versus-untouched conditional total rescue effect on intent-valid repair at the same eligible executable checkpoint; removed endogenous bottleneck, root-cause, failure-cause, taxonomy, and transfer interpretations."
  - "DIRECTION_REVISION: defined source-pinned native E/S/A/V contracts for SWE-agent and OpenHands, separate untouched, neutral-sham, mismatched, and oracle conditions, and pre-outcome provenance, leak, alternative-fix, intent, and inconclusive rules."
  - "DIRECTION_REVISION: retained only a conditional code-agent applicability-boundary contribution, replaced the old full pilot with a feasibility-only kill boundary, recommended READY_FOR_REAUDIT, and did not authorize or begin pilot design, implementation, task download, model calls, training, or experiments."
  - "INDEPENDENT_DIRECTION_REAUDIT: ruled RETURN_TO_IDEA_SEEDING because the narrowed contribution no longer exceeds controlled assistance benchmarking, E/S/A/V remain scaffold-specific semantic roles rather than stable comparable carriers, and the feasibility-only boundary cannot support the core scientific claim."
  - "INDEPENDENT_DIRECTION_REAUDIT: kept pilot_authorized false, retained four existing research pressure points for later divergence, saved the independent report and decision package, and did not generate an idea, begin pilot design, implement, call models, train, experiment, commit, or push."
