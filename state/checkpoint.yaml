    statement: "All 988 merged-index records parse, have unique paper IDs, and resolve through their stored JSONL path and line locator; each venue baseline and build-report count matches its local corpus."
  conclusion:
    claim_type: agent_inference
    source: "reports/cross-venue-corpus-audit-report.json / phase_gate"
